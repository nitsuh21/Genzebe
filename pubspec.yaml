name: genzeb
description: Genzeb — personal finance for Ethiopian market.
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0
  crypto: ^3.0.3
  android_sms_reader: ^0.0.6
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  sqflite: ^2.4.3
  path: ^1.9.1
  http: ^1.6.0
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.1
  share_plus: ^13.2.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    # Local backend config (gitignored; copy env.example.json -> env.json).
    # Bundled so plain `flutter run` works without --dart-define flags.
    - env.json
    # Bank and wallet logos (see assets/logos/SOURCES.md).
    - assets/logos/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#4E5AE8"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
