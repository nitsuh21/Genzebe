name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # env.json is gitignored but listed as an asset in pubspec.yaml;
      # the placeholder copy keeps `flutter analyze` from failing on it.
      - run: cp env.example.json env.json
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
